# The world store keeps the world on disk and serves it to the workers.
apiVersion: v1
kind: Service
metadata:
  name: clustine-worldstore
  labels:
    app.kubernetes.io/name: clustine-worldstore
    app.kubernetes.io/component: worldstore
    app.kubernetes.io/part-of: clustine
spec:
  # Inside the cluster only. The links between the services are plain TCP without
  # authentication: whoever reaches this port can read and overwrite the world.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clustine-worldstore
  ports:
    - name: worldstore
      port: 25602
      targetPort: worldstore
---
# A StatefulSet rather than a Deployment for two reasons: the volume belongs to the one
# pod and stays when the pod is replaced, and there are never two pods at once writing
# to the same world.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clustine-worldstore
  labels:
    app.kubernetes.io/name: clustine-worldstore
    app.kubernetes.io/component: worldstore
    app.kubernetes.io/part-of: clustine
spec:
  replicas: 1
  # The Service a StatefulSet names is usually headless, to give each pod a DNS name.
  # The one store is reached through the Service above and needs no name of its own.
  serviceName: clustine-worldstore
  selector:
    matchLabels:
      app.kubernetes.io/name: clustine-worldstore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clustine-worldstore
        app.kubernetes.io/component: worldstore
        app.kubernetes.io/part-of: clustine
    spec:
      # On SIGTERM the store writes what is not yet on disk; this is how long it has.
      terminationGracePeriodSeconds: 30
      # The service does not talk to the Kubernetes API, so it gets no token for it.
      automountServiceAccountToken: false
      # See coordinator.yaml.
      enableServiceLinks: false
      securityContext:
        # The user the Dockerfile creates.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # A new volume usually belongs to root. This gives it to the group of the user
        # above, so that the store can write to it without being root.
        fsGroup: 10001
        # Only when the volume does not belong to the group yet, rather than going
        # through every file of the world each time the pod starts.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worldstore
          image: clustine:dev
          imagePullPolicy: IfNotPresent
          args:
            - worldstore
            - --listen=0.0.0.0:25602
            # A directory in the volume rather than the volume itself, whose top level
            # may hold things that are not the world, such as lost+found.
            - --world=/data/world
            # As in coordinator.yaml: the store keeps which region holds which chunk,
            # and refuses workers that divide the world otherwise.
            - --boundaries=4
          ports:
            - name: worldstore
              containerPort: 25602
          readinessProbe:
            tcpSocket:
              port: worldstore
            periodSeconds: 5
          # Only to restart a store that has stopped listening altogether. The delay
          # leaves it time to open the world first.
          livenessProbe:
            tcpSocket:
              port: worldstore
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Everything the store writes goes to the volume.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
