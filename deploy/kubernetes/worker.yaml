# The workers simulate the world. Each runs some of the regions it is divided into, as
# the coordinator shares them out.
#
# The Service is headless, which gives every worker a DNS name of its own:
# clustine-worker-0.clustine-worker and so on. An edge has to reach the one worker that
# runs a region, not any of them, so there is nothing for a Service address to share out.
apiVersion: v1
kind: Service
metadata:
  name: clustine-worker
  labels:
    app.kubernetes.io/name: clustine-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: clustine
spec:
  # Headless, and so inside the cluster only. The links between the services are plain
  # TCP without authentication.
  clusterIP: None
  # A worker's name has to resolve from the moment the coordinator passes it on to the
  # edges. That is when the worker has registered, which may be before its readiness
  # probe has passed for the first time.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: clustine-worker
  ports:
    - name: worker
      port: 25601
      targetPort: worker
---
# A StatefulSet because a worker needs a name that it keeps when its pod is replaced:
# the coordinator knows a worker by it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clustine-worker
  labels:
    app.kubernetes.io/name: clustine-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: clustine
spec:
  # The workers share whatever regions there are: one home region at first, and a
  # region more for every group of players that has gone far from the others, which
  # the coordinator spreads over the workers. A worker that is told to stop hands its
  # regions to the others before it goes, and the players of those regions stand
  # still for a moment; a worker that died is found out when its lease is over, and
  # its regions go to the others then. The players stay connected either way. With
  # one worker alone, a worker that is replaced has nobody to hand its regions to,
  # and its players wait until its pod is back.
  replicas: 3
  serviceName: clustine-worker
  # All at once instead of one after the other in the order of their numbers. No worker
  # depends on the one before it, and the edge waits for all of them anyway.
  podManagementPolicy: Parallel
  # A new version is rolled out one worker at a time, and the next one goes only when
  # the pod that took the last one's place is ready: by then its worker has registered
  # with the coordinator (see the readiness probe), so there is always a worker for
  # the next one to hand its region to. This is what a StatefulSet does unless told
  # otherwise; it is written down because moving regions without a pause for the
  # lease depends on it.
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: clustine-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clustine-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: clustine
    spec:
      # On SIGTERM a worker asks the coordinator to move its region to a worker that
      # waits, and goes when that is done, which takes a moment. With nobody to take
      # the region it gives up after 20 seconds, saves what is not yet on disk and
      # goes with the region. This has to be longer than those 20 seconds and the
      # saving: a worker that is killed in the middle of it is a crash, which loses
      # nothing but costs the players the coordinator's lease.
      terminationGracePeriodSeconds: 30
      # The service does not talk to the Kubernetes API, so it gets no token for it.
      automountServiceAccountToken: false
      # See coordinator.yaml.
      enableServiceLinks: false
      securityContext:
        # The user the Dockerfile creates.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: clustine:dev
          imagePullPolicy: IfNotPresent
          env:
            # clustine-worker-0, clustine-worker-1: the same every time the pod starts.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          args:
            - worker
            - --coordinator=clustine-coordinator:25600
            - --store=clustine-worldstore:25602
            - --listen=0.0.0.0:25601
            # Where the edges are told to find this worker: the pod's name under the
            # headless Service, which resolves to this pod alone. Kubernetes puts the
            # variable in before the program sees the argument.
            - --advertise=$(POD_NAME).clustine-worker:25601
            - --name=$(POD_NAME)
          ports:
            - name: worker
              containerPort: 25601
          # A worker listens on this port only once it has registered with the
          # coordinator, so a pod that is ready is a worker that a region can be moved
          # to. A rollout waits for that before it tells the next worker to stop.
          readinessProbe:
            tcpSocket:
              port: worker
            periodSeconds: 5
          # Only to restart a worker that has stopped listening altogether. The delay is
          # long because a worker may have to wait for the coordinator and the world
          # store before it is of use, and restarting it then helps nobody.
          livenessProbe:
            tcpSocket:
              port: worker
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            # A worker writes no files of its own; the world goes to the world store.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
