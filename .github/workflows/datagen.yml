name: Datagen

# Checks that the committed game data is, byte for byte, what the generator makes from
# the pinned server jar (docs/adr/0019, section 3). Downloads the official server jar, so
# it only runs when the output or what it is made from changes: the tool with its Java
# program and its sums, the generated directories, and the lock file, whose versions of
# datagen's dependencies the output is a function of.
on:
  push:
    branches: [main]
    paths:
      - tools/datagen/**
      - crates/clustine-data/src/generated/**
      - crates/clustine-protocol/src/generated/**
      - Cargo.lock
      - .gitattributes
      - .github/workflows/datagen.yml
  pull_request:
    paths:
      - tools/datagen/**
      - crates/clustine-data/src/generated/**
      - crates/clustine-protocol/src/generated/**
      - Cargo.lock
      - .gitattributes
      - .github/workflows/datagen.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A JDK and not only a runtime: datagen compiles its extract program with javac.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # --fresh: nothing a cache restored into target/ is trusted in place of a run.
      - run: cargo run --locked -p clustine-datagen -- --check --fresh
