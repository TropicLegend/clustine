name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The output of the tests is kept as well as shown, for the step at the end.
      # `shell: bash` makes the step fail when cargo does and not only when tee does.
      - name: cargo test --workspace --locked
        shell: bash
        run: cargo test --workspace --locked 2>&1 | tee test.log
      # The end-to-end tests once more, with the world divided into three regions: one
      # boundary runs through the spawn point, where the tests build, and one where
      # their longer walks cross it.
      - name: cargo test -p clustine --locked, on a divided world
        shell: bash
        run: cargo test -p clustine --locked 2>&1 | tee -a test.log
        env:
          CLUSTINE_TEST_BOUNDARIES: "0,4"
      # Says on the run's summary page which tests failed and with what, where it can be
      # read without opening the log, which takes being signed in.
      - name: Name the tests that failed
        if: failure()
        shell: bash
        run: |
          # Nothing to name if the build is what failed; that is not this step's failure.
          { grep -E -A 3 '^test .*FAILED|panicked at' test.log || true; } | head -n 60 |
            while IFS= read -r line; do
              echo "::error::${line}"
            done
