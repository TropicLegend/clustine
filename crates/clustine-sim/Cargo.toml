[package]
name = "clustine-sim"
description = "Region simulation: the tick loop and game mechanics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clustine-blocks.workspace = true
clustine-data.workspace = true
clustine-noise.workspace = true
clustine-world.workspace = true
clustine-light.workspace = true
clustine-features.workspace = true
# The game's zoomed biome lookup (`BiomeManager.getBiome`), which spawning reads.
clustine-terrain.workspace = true
# The configured trees' trunks, for the shortest a sapling grows (`TreeGrower.getMinimumHeight`).
clustine-worldgen-data.workspace = true
# `StrictMath`'s sine and cosine, for the one angle of a throw the game takes them for.
libm = "0.2"
# A mob's parts in its record, in an encoding that is the same bytes wherever it runs.
postcard.workspace = true
serde.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
