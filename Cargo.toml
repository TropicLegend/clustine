[workspace]
resolver = "3"
members = ["crates/*", "services/*", "bin/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
clustine = { path = "bin/clustine" }
clustine-botswarm = { path = "tools/botswarm" }
clustine-coordinator = { path = "services/coordinator" }
clustine-data = { path = "crates/clustine-data" }
clustine-edge = { path = "services/edge" }
clustine-format = { path = "crates/clustine-format" }
clustine-light = { path = "crates/clustine-light" }
clustine-noise = { path = "crates/clustine-noise" }
clustine-protocol = { path = "crates/clustine-protocol" }
clustine-region = { path = "crates/clustine-region" }
clustine-rpc = { path = "crates/clustine-rpc" }
clustine-sim = { path = "crates/clustine-sim" }
clustine-terrain = { path = "crates/clustine-terrain" }
clustine-worker = { path = "services/worker" }
clustine-world = { path = "crates/clustine-world" }
clustine-worldgen-data = { path = "crates/clustine-worldgen-data" }
clustine-worldgen = { path = "services/worldgen" }
clustine-worldstore = { path = "services/worldstore" }

anyhow = "1.0.104"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
flate2 = "1.1.10"
md-5 = "0.11.0"
postcard = { version = "1.1.3", features = ["use-std"] }
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3.4.2"
uuid = { version = "1.27.0", features = ["serde", "v4"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
zstd = "0.14.0"

# A job of light is the flood of `clustine-light` over blocks it reads through
# `clustine-world` and asks `clustine-data` about, and the tests run it without
# optimisation otherwise: 15.6 ms a chunk of the sample world, against 2.1 ms in a release
# build. With the first of these lines it is 5.3 ms, with the second 3.3 ms and with all
# three 2.5 ms (ADR-0023, section 10). The test profile inherits them.
[profile.dev.package.clustine-light]
opt-level = 3

[profile.dev.package.clustine-world]
opt-level = 3

[profile.dev.package.clustine-data]
opt-level = 3

# A chunk of a world with a seed is the noise of `clustine-noise`, by the tables of
# `clustine-worldgen-data`, through `clustine-terrain`, and the end-to-end test of such
# a world makes some hundreds of them: about a third of a second each without
# optimisation, against 12 ms in a release build.
[profile.dev.package.clustine-terrain]
opt-level = 3

[profile.dev.package.clustine-noise]
opt-level = 3

[profile.dev.package.clustine-worldgen-data]
opt-level = 3
