[workspace]
resolver = "3"
members = ["crates/*", "services/*", "bin/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
flate2 = "1.1.10"
proptest = "1.11.0"
serde_json = "1.0.151"
sha1 = "0.11.0"
thiserror = "2.0.21"
ureq = "3.4.2"
uuid = "1.27.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
