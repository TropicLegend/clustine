[workspace]
resolver = "3"
members = ["crates/*", "services/*", "bin/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
clustine = { path = "bin/clustine" }
clustine-botswarm = { path = "tools/botswarm" }
clustine-data = { path = "crates/clustine-data" }
clustine-edge = { path = "services/edge" }
clustine-protocol = { path = "crates/clustine-protocol" }

anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
md-5 = "0.11.0"
proptest = "1.11.0"
serde_json = "1.0.151"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3.4.2"
uuid = { version = "1.27.0", features = ["v4"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
